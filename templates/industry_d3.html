<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產業鏈戰情室</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='glass.css') }}">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: var(--font); color: var(--text-1); }
        /* 內容層：柔和的環境光底色，讓上方的玻璃層有東西可以折射 */
        body {
            background:
                radial-gradient(55% 45% at 15% 20%, rgba(56, 120, 200, 0.22), transparent 70%),
                radial-gradient(45% 40% at 85% 80%, rgba(255, 120, 60, 0.14), transparent 70%),
                radial-gradient(40% 35% at 55% 50%, rgba(90, 200, 250, 0.08), transparent 70%),
                #070a12;
        }
        svg#canvas { width: 100vw; height: 100vh; display: block; }

        #nav-header { position: absolute; top: 16px; left: 16px; z-index: 1000; padding: 10px 18px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
        #nav-header a { color: var(--text-2); text-decoration: none; transition: color 0.2s; }
        #nav-header a:hover { color: var(--text-1); }
        #nav-header .sep { color: var(--text-3); }
        
        .node { stroke-width: 2px; cursor: pointer; transition: all 0.3s; }
        .link { stroke: #1e293b; stroke-opacity: 0.4; stroke-width: 1.2px; }
        
        /* 漲跌色系 */
        .up-node { fill: #f43f5e !important; } 
        .down-node { fill: #10b981 !important; }
        .stable-node { fill: #64748b !important; }
        .industry-node { fill: #0ea5e9 !important; stroke: #fff !important; }
        
        .label-name { font-weight: bold; fill: #f1f5f9; font-size: 13px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
        .label-price { font-size: 11px; font-weight: bold; pointer-events: none; }
        .text-up { fill: #fb7185; }
        .text-down { fill: #34d399; }
        .text-stable { fill: #94a3b8; }
        .badge-stable { color: #94a3b8; }

        /* 狀態提示：浮動玻璃膠囊，錯誤時帶紅色調 */
        #status-banner { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 3000; display: none; padding: 8px 18px; font-size: 13px; font-weight: 600; max-width: calc(100vw - 32px); text-align: center; }
        #status-banner.loading { display: block; color: #bfe9ff; }
        #status-banner.error { display: block; color: #ffd6dc; background: rgba(255, 70, 100, 0.22); border-color: rgba(255, 120, 140, 0.45); }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .core-pulse { fill: none; stroke: #0ea5e9; stroke-width: 2px; animation: pulse-ring 2s infinite cubic-bezier(0.45, 0, 0.55, 1); pointer-events: none; transform-origin: center; transform-box: fill-box; }

        /* 導覽按鈕：玻璃膠囊（位置用 translate 置中，hover 只改亮度不改 transform） */
        .nav-btn {
            position: absolute; display: none; z-index: 1000;
            padding: 11px 22px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }
        .nav-btn:hover { background: var(--glass-tint-strong); filter: brightness(1.15); }
        .nav-btn:active { filter: brightness(0.9); }
        #btn-up { top: 76px; left: 50%; transform: translateX(-50%); }
        #btn-down { bottom: 28px; left: 50%; transform: translateX(-50%); }
        #btn-left { top: 50%; left: 24px; transform: translateY(-50%); }
        #btn-right { top: 50%; right: 24px; transform: translateY(-50%); }
        #btn-back { top: 16px; right: 16px; background: rgba(255, 70, 100, 0.28); border-color: rgba(255, 140, 160, 0.5); }

        /* 右側分析面板：內縮的浮動玻璃面板（像 iOS 的半頁 sheet，四周露出底下內容） */
        #analysis-sidebar {
            position: absolute; top: 12px; right: 12px; bottom: 12px; width: 360px; max-width: calc(100vw - 24px);
            border-radius: var(--radius-l); z-index: 2000; padding: 26px 20px; box-sizing: border-box; overflow-y: auto;
            transform: translateX(calc(100% + 24px)); opacity: 0;
            transition: transform 0.5s cubic-bezier(0.32, 1.25, 0.6, 1), opacity 0.3s ease;
        }
        #analysis-sidebar.open { transform: translateX(0); opacity: 1; }
        .sidebar-close {
            position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--glass-edge); background: rgba(255, 255, 255, 0.08); color: var(--text-2);
            font-size: 18px; line-height: 1; cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .sidebar-close:hover { background: rgba(255, 255, 255, 0.18); color: var(--text-1); }

        /* 面板內區塊：不再疊玻璃，只用淡底色分組；圓角與面板同心（28 − 內距 ≈ 16） */
        .card { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
        .card-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .data-row:last-child { margin-bottom: 0; }
        .data-label { color: var(--text-2); }
        .data-value { font-weight: 600; font-variant-numeric: tabular-nums; }
        .badge-up { color: var(--up); }
        .badge-down { color: var(--down); }
    </style>
</head>
<body>
    {% include '_glass_filter.html' %}
    <div id="status-banner" class="glass glass-pill" role="status" aria-live="polite"></div>
    <nav id="nav-header" class="glass glass-pill refract" aria-label="導覽">
        <a href="/">← 產業列表</a><span class="sep">/</span><strong>{{ major_id }}</strong>
    </nav>

    <button id="btn-back" class="nav-btn glass refract" onclick="exitFocusMode()">返回總覽</button>
    <button id="btn-up" class="nav-btn glass refract" onclick="navigate('up')">▲</button>
    <button id="btn-down" class="nav-btn glass refract" onclick="navigate('down')">▼</button>
    <button id="btn-left" class="nav-btn glass refract" onclick="navigate('left')">◀</button>
    <button id="btn-right" class="nav-btn glass refract" onclick="navigate('right')">▶</button>

    <aside id="analysis-sidebar" class="glass refract" aria-label="公司分析">
        <button class="sidebar-close" onclick="closeSidebar()" aria-label="關閉">×</button>
        <h2 id="sb-company-name" style="margin: 6px 40px 4px 0; font-size: 24px; font-weight: 700;">公司名稱</h2>
        <div id="sb-stock-id" style="color: var(--text-3); font-size: 14px; margin-bottom: 22px;">XXXX</div>

        <div class="card">
            <div class="card-title">市場報價</div>
            <div class="data-row"><span class="data-label">最新股價</span><span class="data-value" id="sb-price">--</span></div>
            <div class="data-row"><span class="data-label">今日漲跌幅</span><span class="data-value" id="sb-change">--</span></div>
        </div>

        <div class="card">
            <div class="card-title">營收動能</div>
            <div class="data-row"><span class="data-label">資料月份</span><span class="data-value" id="sb-month">--</span></div>
            <div class="data-row"><span class="data-label">營收年增率 (YoY)</span><span class="data-value" id="sb-yoy">--</span></div>
            <div class="data-row"><span class="data-label">營收月增率 (MoM)</span><span class="data-value" id="sb-mom">--</span></div>
            <div class="data-row"><span class="data-label">累計年增率</span><span class="data-value" id="sb-acc-yoy">--</span></div>
        </div>

        <div class="card">
            <div class="card-title">法人動向</div>
            <div class="data-row"><span class="data-label">最近交易日</span><span class="data-value" id="sb-trade-date">--</span></div>
            <div class="data-row"><span class="data-label">投信買賣超</span><span class="data-value" id="sb-trust">--</span></div>
            <div class="data-row"><span class="data-label">外資買賣超</span><span class="data-value" id="sb-foreign">--</span></div>
        </div>
    </aside>

    <svg id="canvas"></svg>

    <script>
        const majorId = {{ major_id | tojson }};
        let width = window.innerWidth, height = window.innerHeight;
        let nodes = [], links = [], allIndustryData = []; 
        let currentFocusedIndustry = null; 

        const svg = d3.select("#canvas");
        const container = svg.append("g");
        const linkLayer = container.append("g");
        const nodeLayer = container.append("g");

        // 💡 底部層級標籤
        const labelLayer = svg.append("g").attr("class", "label-layer");
        labelLayer.append("text").attr("x", "15%").attr("y", window.innerHeight - 20).attr("text-anchor", "middle").style("fill", "#64748b").style("font-size", "14px").style("font-weight", "bold").text("上游");
        labelLayer.append("text").attr("x", "50%").attr("y", window.innerHeight - 20).attr("text-anchor", "middle").style("fill", "#64748b").style("font-size", "14px").style("font-weight", "bold").text("中游");
        labelLayer.append("text").attr("x", "85%").attr("y", window.innerHeight - 20).attr("text-anchor", "middle").style("fill", "#64748b").style("font-size", "14px").style("font-weight", "bold").text("下游");

        const simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id).distance(160))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("collision", d3.forceCollide().radius(d => getRadius(d) + 35));

        function handleResize() {
            width = window.innerWidth; height = window.innerHeight;
            svg.attr("width", width).attr("height", height);
            simulation.force("x", d3.forceX(d => {
                if (currentFocusedIndustry) return width / 2;
                if (d.group === 'Upstream') return width * 0.15;
                if (d.group === 'Midstream') return width * 0.5;
                if (d.group === 'Downstream') return width * 0.85;
                return width * 0.5;
            }).strength(3.0));
            simulation.force("y", d3.forceY(height / 2).strength(0.8));
            // 💡 更新底部標籤位置
            labelLayer.selectAll("text").attr("y", height - 20).attr("x", (d, i) => {
                if (i === 0) return width * 0.15;
                if (i === 1) return width * 0.5;
                return width * 0.85;
            });
            simulation.alpha(0.3).restart();
        }
        window.addEventListener("resize", handleResize);

        function getRadius(d) { return d.type === "industry" ? 45 : 25 + Math.min(Math.abs(d.change || 0) * 1.5, 15); }

        function getHexPath(r) {
            const points = [];
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                points.push([r * Math.cos(angle), r * Math.sin(angle)]);
            }
            return d3.line()(points) + "Z";
        }

        // ---- 載入中／錯誤提示 ----
        let pendingRequests = 0, lastError = null;
        function renderBanner() {
            const el = document.getElementById("status-banner");
            if (lastError) { el.className = "error"; el.textContent = lastError; }
            else if (pendingRequests > 0) { el.className = "loading"; el.textContent = "載入中…"; }
            else { el.className = ""; el.textContent = ""; }
        }
        // 包住一個請求：進行中顯示「載入中…」，失敗（非 2xx 或網路錯誤）顯示紅色錯誤
        function track(promise, what) {
            pendingRequests++; lastError = null; renderBanner();
            return promise.catch(err => {
                lastError = `${what}失敗：${err && err.message ? err.message : err}`;
                throw err;
            }).finally(() => { pendingRequests--; renderBanner(); });
        }
        // 請求成功但後續渲染丟出例外：記到 console 並顯示在錯誤橫幅（請求失敗已由 track 設定訊息）
        function showRenderError(err) {
            console.error(err);
            if (!lastError) { lastError = `顯示資料失敗：${err && err.message ? err.message : err}`; renderBanner(); }
        }
        function fetchJSON(url) {
            return fetch(url).then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            });
        }

        // ---- 缺值（null）一律顯示「—」並用中性色，不當成 0 ----
        const isNil = v => v === null || v === undefined;
        const fmtNum = (v, suffix = "") => isNil(v) ? "—" : `${v}${suffix}`;
        const fmtSigned = (v, suffix = "") => isNil(v) ? "—" : `${v > 0 ? '+' : ''}${v}${suffix}`;
        const upDownClass = (v, prefix) => isNil(v) || v === 0 ? `${prefix}-stable` : (v > 0 ? `${prefix}-up` : `${prefix}-down`);

        track(d3.json(`/api/industry_nodes/${majorId}`), "載入產業節點").then(data => {
            allIndustryData = data; nodes = data.map(d => ({...d})); handleResize(); update();
        }).catch(showRenderError);

        // 💡 側邊欄異步獲取跨表資料
        function openSidebar(stockId) {
            track(fetchJSON(`/api/company_analysis/${stockId}`), "載入公司資料")
                .then(res => {
                    if (!res.success) return;
                    
                    document.getElementById("sb-company-name").innerText = res.basic.company_name;
                    document.getElementById("sb-stock-id").innerText = `${res.basic.stock_id} • ${res.basic.market_type || '上市'}`;
                    document.getElementById("sb-price").innerText = fmtNum(res.basic.latest_price, " 元");
                    
                    const changeEl = document.getElementById("sb-change");
                    const chg = res.basic.latest_change;
                    changeEl.innerText = fmtSigned(chg, "%");
                    changeEl.className = `data-value ${upDownClass(chg, 'badge')}`;

                    if (res.growth) {
                        document.getElementById("sb-month").innerText = res.growth.data_month;
                        document.getElementById("sb-yoy").innerText = fmtNum(res.growth.yoy_pct, "%");
                        document.getElementById("sb-mom").innerText = fmtNum(res.growth.mom_pct, "%");
                        document.getElementById("sb-acc-yoy").innerText = fmtNum(res.growth.acc_yoy_pct, "%");
                    } else {
                        ['sb-month', 'sb-yoy', 'sb-mom', 'sb-acc-yoy'].forEach(id => document.getElementById(id).innerText = '--');
                    }

                    if (res.smart_money) {
                        document.getElementById("sb-trade-date").innerText = res.smart_money.trade_date;
                        const t_jhang = isNil(res.smart_money.trust_net) ? null : Math.round(res.smart_money.trust_net / 1000);
                        const f_jhang = isNil(res.smart_money.foreign_net) ? null : Math.round(res.smart_money.foreign_net / 1000);
                        
                        const t_el = document.getElementById("sb-trust");
                        t_el.innerText = fmtSigned(t_jhang, " 張");
                        t_el.className = `data-value ${upDownClass(t_jhang, 'badge')}`;
                        
                        const f_el = document.getElementById("sb-foreign");
                        f_el.innerText = fmtSigned(f_jhang, " 張");
                        f_el.className = `data-value ${upDownClass(f_jhang, 'badge')}`;
                    } else {
                        ['sb-trade-date', 'sb-trust', 'sb-foreign'].forEach(id => document.getElementById(id).innerText = '--');
                    }

                    document.getElementById("analysis-sidebar").classList.add("open");
                }).catch(showRenderError);
        }

        function closeSidebar() { document.getElementById("analysis-sidebar").classList.remove("open"); }

        function enterFocusMode(d, direction = 'center') {
            currentFocusedIndustry = d; closeSidebar();
            track(d3.json(`/api/node_companies/${d.id}`), "載入公司清單").then(cs => {
                let startX = width / 2, startY = height / 2;
                if(direction === 'up') startY = height + 200;
                if(direction === 'down') startY = -200;
                if(direction === 'left') startX = width + 200;
                if(direction === 'right') startX = -200;

                nodes = [
                    { ...d, x: width / 2, y: height / 2, fx: width / 2, fy: height / 2 }, 
                    ...cs.map(c => ({ ...c, x: startX, y: startY, parentId: d.id }))
                ];
                links = cs.map(c => ({ source: d.id, target: c.id }));
                d3.select("#btn-back").style("display", "block");
                updateNavButtons(); handleResize(); update();
            }).catch(err => { currentFocusedIndustry = null; showRenderError(err); });
        }

        function exitFocusMode() {
            if(nodes[0]) { nodes[0].fx = null; nodes[0].fy = null; }
            currentFocusedIndustry = null; links = []; closeSidebar();
            nodes = allIndustryData.map(d => ({...d}));
            d3.selectAll(".nav-btn").style("display", "none");
            handleResize(); update();
        }

        function updateNavButtons() {
            d3.selectAll(".nav-btn:not(#btn-back)").style("display", "none");
            if (!currentFocusedIndustry) return;
            const groups = ["Upstream", "Midstream", "Downstream"];
            const currG = groups.indexOf(currentFocusedIndustry.group);
            const sameG = allIndustryData.filter(n => n.group === currentFocusedIndustry.group);
            const currIdx = sameG.findIndex(n => n.id === currentFocusedIndustry.id);
            if (currG > 0) d3.select("#btn-left").style("display", "block").text(`◀ ${groups[currG-1]}`);
            if (currG < 2) d3.select("#btn-right").style("display", "block").text(`${groups[currG+1]} ▶`);
            if (currIdx > 0) d3.select("#btn-up").style("display", "block").text(`▲ ${sameG[currIdx-1].name}`);
            if (currIdx < sameG.length - 1) d3.select("#btn-down").style("display", "block").text(`▼ ${sameG[currIdx+1].name}`);
        }

        function navigate(dir) {
            const groups = ["Upstream", "Midstream", "Downstream"];
            const currG = groups.indexOf(currentFocusedIndustry.group);
            const sameG = allIndustryData.filter(n => n.group === currentFocusedIndustry.group);
            const currIdx = sameG.findIndex(n => n.id === currentFocusedIndustry.id);
            let target = null;
            if (dir === 'up') target = sameG[currIdx-1];
            if (dir === 'down') target = sameG[currIdx+1];
            if (dir === 'left') target = allIndustryData.find(n => n.group === groups[currG-1]);
            if (dir === 'right') target = allIndustryData.find(n => n.group === groups[currG+1]);
            if (target) enterFocusMode(target, dir);
        }

        function update() {
            const link = linkLayer.selectAll(".link").data(links, d => `${d.source.id || d.source}-${d.target.id || d.target}`);
            link.exit().remove();
            const linkEnter = link.enter().append("line").attr("class", "link");

            const node = nodeLayer.selectAll(".node-group").data(nodes, d => d.id);
            node.exit().remove();

            const nodeEnter = node.enter().append("g").attr("class", "node-group")
                .style("opacity", 0)
                .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended))
                .on("click", (e, d) => {
                    if (d.type === "industry" && !currentFocusedIndustry) {
                        enterFocusMode(d);
                    } else if (d.type === "company") {
                        e.stopPropagation(); 
                        openSidebar(d.id);   
                    }
                });

            nodeEnter.transition().duration(800).style("opacity", 1);

            nodeEnter.each(function(d) {
                const el = d3.select(this); const r = getRadius(d);
                if (d.type === "industry") {
                    if (currentFocusedIndustry) { el.append("circle").attr("r", r).attr("class", "core-pulse"); }
                    el.append("path").attr("d", getHexPath(r)).attr("class", "node industry-node");
                    el.append("circle").attr("r", 5).attr("fill", "#fff").style("opacity", 0.8);
                } else {
                    el.append("circle").attr("r", r).attr("class", d => {
                        const c = d.change; return isNil(c) || c === 0 ? "node stable-node" : (c > 0 ? "node up-node" : "node down-node");
                    });
                }
            });

            const text = nodeEnter.append("text").attr("text-anchor", "middle").attr("dy", d => getRadius(d) + 25);
            text.append("tspan").attr("x", 0).attr("class", "label-name").text(d => d.name);
            text.append("tspan").attr("x", 0).attr("dy", "1.2em")
                .attr("class", d => `label-price ${upDownClass(d.change, 'text')}`)
                .text(d => d.type === "company" ? `${fmtNum(d.price)} (${fmtSigned(d.change, "%")})` : "");

            simulation.nodes(nodes); simulation.force("link").links(links); simulation.alpha(1).restart();

            simulation.on("tick", () => {
                const currW = window.innerWidth; const currH = window.innerHeight; const cX = currW / 2, cY = currH / 2;
                linkEnter.merge(link).attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                
                nodeEnter.merge(node).each(function(d) {
                    const group = d3.select(this); const r = getRadius(d); const pad = 40; 
                    d.x = Math.max(r + pad, Math.min(currW - r - pad, d.x)); d.y = Math.max(r + pad, Math.min(currH - r - pad, d.y));
                    
                    // 💡 取消邊緣縮小效果
                    const scale = 1;
                    const opacity = 1;

                    // 💡 總覽與聚焦模式下的發光分流判定
                    if (currentFocusedIndustry) {
                        const dx = d.x - cX, dy = d.y - cY; const dist = Math.sqrt(dx * dx + dy * dy); const maxD = Math.min(currW, currH) / 1.5;
                        const brightness = Math.max(0.4, 1.3 - (dist / maxD) * 0.9); const glowIntensity = Math.max(0, 25 - (dist / maxD) * 30);
                        group.selectAll("path, circle").attr("transform", `scale(${scale})`).style("opacity", Math.min(1, brightness + 0.2))
                             .style("filter", d.type === "industry" ? `drop-shadow(0 0 ${glowIntensity}px #0ea5e9) brightness(${brightness})` : "none");
                    } else {
                        group.selectAll("path, circle").attr("transform", `scale(${scale})`).style("opacity", opacity).style("filter", "none");
                    }
                    group.select("text").style("opacity", opacity).attr("transform", `scale(${scale})`);
                    group.attr("transform", `translate(${d.x},${d.y})`);
                });
            });
        }

        function dragstarted(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
        function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
        function dragended(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
        svg.call(d3.zoom().on("zoom", (e) => container.attr("transform", e.transform)));
    </script>
</body>
</html>
