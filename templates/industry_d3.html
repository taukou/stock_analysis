<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ major_name }}｜產業鏈戰情室</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='glass.css') }}">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: var(--font); color: var(--text-1); }
        /* 內容層：柔和的環境光底色，讓上方的玻璃層有東西可以折射 */
        body {
            background:
                radial-gradient(55% 45% at 15% 20%, rgba(56, 120, 200, 0.22), transparent 70%),
                radial-gradient(45% 40% at 85% 80%, rgba(255, 120, 60, 0.14), transparent 70%),
                radial-gradient(40% 35% at 55% 50%, rgba(90, 200, 250, 0.08), transparent 70%),
                #070a12;
        }
        svg#canvas { width: 100vw; height: 100vh; display: block; }

        #nav-header { position: absolute; top: 16px; left: 16px; z-index: 1000; padding: 10px 18px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
        #nav-header a { color: var(--text-2); text-decoration: none; transition: color 0.2s; }
        #nav-header a:hover { color: var(--text-1); }
        #nav-header .sep { color: var(--text-3); }
        
        .node { stroke-width: 2px; cursor: pointer; transition: all 0.3s; }
        .link { stroke: #1e293b; stroke-opacity: 0.4; stroke-width: 1.2px; }
        
        /* 漲跌色系 */
        .up-node { fill: #f43f5e !important; } 
        .down-node { fill: #10b981 !important; }
        .stable-node { fill: #64748b !important; }
        .industry-node { stroke: #fff !important; }   /* 填色由 JS 依區間熱度設定（Fmt.heatColor） */
        .supply-link { fill: none; stroke: #94a3b8; stroke-opacity: 0.55; stroke-width: 1.2px; pointer-events: none; }
        .supply-hit { fill: none; stroke: transparent; stroke-width: 14px; cursor: help; }
        .supply .supply-link { transition: stroke 0.2s, stroke-opacity 0.2s; }
        .supply.hot .supply-link { stroke: #e2e8f0; stroke-opacity: 1; stroke-width: 2px; }
        .supply.dim .supply-link { stroke-opacity: 0.12; }
        .ex-tag { fill: var(--ex); font-size: 10px; font-weight: 700; pointer-events: none; paint-order: stroke; stroke: rgba(7, 10, 18, 0.85); stroke-width: 3px; }
        .sig-star { fill: #fbbf24; font-size: 13px; cursor: help; paint-order: stroke; stroke: rgba(7, 10, 18, 0.85); stroke-width: 2px; }
        
        .label-name { font-weight: bold; fill: #f1f5f9; font-size: 13px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
        .label-price { font-size: 11px; font-weight: bold; pointer-events: none; }
        .text-up { fill: #fb7185; }
        .text-down { fill: #34d399; }
        .text-stable { fill: #94a3b8; }
        .badge-stable { color: #94a3b8; }

        /* 狀態提示：浮動玻璃膠囊，錯誤時帶紅色調 */
        #status-banner { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 3000; display: none; padding: 8px 18px; font-size: 13px; font-weight: 600; max-width: calc(100vw - 32px); text-align: center; }
        #status-banner.loading { display: block; color: #bfe9ff; }
        #status-banner.error { display: block; color: #ffd6dc; background: rgba(255, 70, 100, 0.22); border-color: rgba(255, 120, 140, 0.45); }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .core-pulse { fill: none; stroke: #0ea5e9; stroke-width: 2px; animation: pulse-ring 2s infinite cubic-bezier(0.45, 0, 0.55, 1); pointer-events: none; transform-origin: center; transform-box: fill-box; }

        /* 導覽按鈕：玻璃膠囊（位置用 translate 置中，hover 只改亮度不改 transform） */
        .nav-btn {
            position: absolute; display: none; z-index: 1000;
            padding: 11px 22px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }
        .nav-btn:hover { background: var(--glass-tint-strong); filter: brightness(1.15); }
        .nav-btn:active { filter: brightness(0.9); }
        #btn-up { top: 68px; left: 50%; transform: translateX(-50%); }
        #btn-down { bottom: 28px; left: 50%; transform: translateX(-50%); }
        #btn-left { top: 50%; left: 24px; transform: translateY(-50%); }
        #btn-right { top: 50%; right: 24px; transform: translateY(-50%); }
        /* 左下角膠囊抬高到「上游」標籤（y = 視窗高 − 20）之上，避免重疊 */
        #freshness { bottom: 44px; }
        /* 右上角供應方向說明（只在總覽顯示；聚焦時右上角給「返回總覽」） */
        #supply-legend { position: fixed; right: 16px; top: 16px; z-index: 900; padding: 7px 14px; font-size: 12px; color: var(--text-2); max-width: min(520px, calc(100vw - 32px)); }
        body.focus-mode #supply-legend { display: none; }
        #btn-back { top: 16px; right: 16px; background: rgba(255, 70, 100, 0.28); border-color: rgba(255, 140, 160, 0.5); }

        /* 區間切換：置於上方中央（top:16px），#btn-up 在其下方 top:68px；狀態橫幅改放下方避免重疊 */
        #period-switch { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; gap: 2px; padding: 4px; }
        #period-switch button {
            border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; font-weight: 600;
            padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        #period-switch button:hover { color: var(--text-1); }
        #period-switch button.active { background: rgba(255, 255, 255, 0.18); color: var(--text-1); }
        /* 節點副標切換（漲跌｜外資｜投信）：放在區間切換下方第二列，任何寬度都不會壓到左上導覽列
           （只在總覽顯示；聚焦模式隱藏，該位置留給 #btn-up） */
        #flow-switch { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; gap: 2px; padding: 4px; }
        #flow-switch button {
            border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; font-weight: 600;
            padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        #flow-switch button:hover { color: var(--text-1); }
        #flow-switch button.active { background: rgba(255, 255, 255, 0.18); color: var(--text-1); }
        body.focus-mode #flow-switch { display: none; }
        .label-tag.tag-lead { fill: #ff6b81; font-weight: 700; }
        .label-tag.tag-lag { fill: #3ddc97; font-weight: 700; }
        /* 側邊欄開啟時，切換與 #btn-up 一起置中於剩餘空間（面板 360 + 邊距 24） */
        body.sidebar-open #period-switch, body.sidebar-open #flow-switch, body.sidebar-open #btn-up { left: calc((100vw - 384px) / 2); }

        /* 右側分析面板：內縮的浮動玻璃面板（像 iOS 的半頁 sheet，四周露出底下內容） */
        #analysis-sidebar {
            position: absolute; top: 12px; right: 12px; bottom: 12px; width: 360px; max-width: calc(100vw - 24px);
            border-radius: var(--radius-l); z-index: 2500; padding: 26px 20px; box-sizing: border-box; overflow-y: auto;
            transform: translateX(calc(100% + 24px)); opacity: 0;
            transition: transform 0.5s cubic-bezier(0.32, 1.25, 0.6, 1), opacity 0.3s ease;
        }
        #analysis-sidebar.open { transform: translateX(0); opacity: 1; }
        .sidebar-close {
            position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--glass-edge); background: rgba(255, 255, 255, 0.08); color: var(--text-2);
            font-size: 18px; line-height: 1; cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .sidebar-close:hover { background: rgba(255, 255, 255, 0.18); color: var(--text-1); }

        /* 面板內區塊：不再疊玻璃，只用淡底色分組；圓角與面板同心（28 − 內距 ≈ 16） */
        .card { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
        .card-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .data-row:last-child { margin-bottom: 0; }
        .data-label { color: var(--text-2); }
        .data-value { font-weight: 600; font-variant-numeric: tabular-nums; }
        .badge-up { color: var(--up); }
        .badge-down { color: var(--down); }
        .badge-stable { color: var(--text-3); }
        .chart-box { margin-top: 10px; color: var(--text-2); }
        .chart-title { font-size: 12px; color: var(--text-2); margin: 10px 0 2px; }
        .ret-row { display: flex; gap: 8px; }
        .ret-cell { flex: 1; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
        .ret-cell .ret-label { display: block; color: var(--text-2); font-size: 12px; margin-bottom: 2px; }
        .ret-cell .ret-val { font-weight: 600; }
        #sb-ex-badge { display: none; margin-top: 8px; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ex) 20%, transparent); color: var(--ex); }
        #sb-signals, #sb-ex-list { font-size: 13px; }
        .signal-item { margin-bottom: 8px; }
        .signal-item:last-child { margin-bottom: 0; }
        .signal-detail { color: var(--text-2); font-size: 12px; }
        .empty-note { color: var(--text-2); }
        #sb-star { position: absolute; top: 18px; right: 58px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--glass-edge); background: rgba(255, 255, 255, 0.08); color: var(--text-2); font-size: 18px; line-height: 1; cursor: pointer; }
        #sb-star.on { color: var(--ex); }
        /* 側邊欄開啟時，右側導覽鈕移到面板左邊，避免蓋住 ☆／× */
        body.sidebar-open #btn-back, body.sidebar-open #btn-right { right: calc(360px + 36px); }

        /* 走勢面板：右下角開關＋可收合玻璃面板（側邊欄開啟時讓位） */
        #trend-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 1100; padding: 9px 18px; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-1); cursor: pointer; }
        #trend-toggle[aria-expanded="true"] { background: rgba(255, 255, 255, 0.18); }
        #trend-panel { position: fixed; right: 16px; bottom: 64px; z-index: 1100; width: 400px; max-width: calc(100vw - 32px); max-height: calc(100vh - 150px); overflow-y: auto; box-sizing: border-box; padding: 16px 18px; border-radius: var(--radius-l); display: none; font-size: 13px; }
        #trend-panel.open { display: block; }
        body.sidebar-open #trend-toggle, body.sidebar-open #trend-panel { display: none; }
        .trend-row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .trend-row .lbl { color: var(--text-2); font-size: 12px; margin-right: 2px; }
        .trend-row button { border: 0; background: rgba(255, 255, 255, 0.06); color: var(--text-2); font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
        .trend-row button:hover { color: var(--text-1); }
        .trend-row button.active { background: rgba(255, 255, 255, 0.2); color: var(--text-1); }
        #trend-nodes { max-height: 96px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--text-2); font-size: 12px; }
        #trend-nodes label { cursor: pointer; white-space: nowrap; }
        #trend-nodes input:disabled + span { opacity: 0.4; }
        #trend-msg { color: var(--text-2); padding: 28px 0; text-align: center; }
        #trend-msg.error { color: #ffd6dc; }
        .trend-notes { margin-top: 10px; font-size: 11px; line-height: 1.5; color: var(--text-3); }
        .trend-notes div { margin-top: 2px; }
        .trend-notes .warn { color: var(--ex); }
    </style>
</head>
<body>
    {% include '_glass_filter.html' %}
    <div id="status-banner" class="glass glass-pill" role="status" aria-live="polite"></div>
    <nav id="nav-header" class="glass glass-pill refract" aria-label="導覽">
        <a href="/">← 產業列表</a><span class="sep">/</span><strong>{{ major_name }}</strong>
        <input id="search-input" class="search-input" type="search" placeholder="搜尋代號／名稱" aria-label="搜尋公司" autocomplete="off">
    </nav>
    <div id="search-list" class="search-list glass" role="listbox"></div>
    <div id="freshness" class="glass glass-pill" role="status">資料狀態載入中…</div>
    <div id="supply-legend" class="glass glass-pill" aria-live="polite">箭頭方向 ＝ 供應給（上游 → 下游）</div>

    <div id="period-switch" class="glass glass-pill" role="group" aria-label="區間">
        <button type="button" data-period="1" class="active" aria-pressed="true">今日</button>
        <button type="button" data-period="5" aria-pressed="false">5 日</button>
        <button type="button" data-period="20" aria-pressed="false">20 日</button>
    </div>

    <div id="flow-switch" class="glass glass-pill" role="group" aria-label="節點顯示">
        <button type="button" data-flow="change" class="active" aria-pressed="true">漲跌</button>
        <button type="button" data-flow="foreign" aria-pressed="false">外資</button>
        <button type="button" data-flow="trust" aria-pressed="false">投信</button>
    </div>

    <button id="btn-back" class="nav-btn glass refract" onclick="exitFocusMode()">返回總覽</button>
    <button id="btn-up" class="nav-btn glass refract" onclick="navigate('up')">▲</button>
    <button id="btn-down" class="nav-btn glass refract" onclick="navigate('down')">▼</button>
    <button id="btn-left" class="nav-btn glass refract" onclick="navigate('left')">◀</button>
    <button id="btn-right" class="nav-btn glass refract" onclick="navigate('right')">▶</button>

    <aside id="analysis-sidebar" class="glass refract" aria-label="公司分析">
        <button class="sidebar-close" onclick="closeSidebar()" aria-label="關閉">×</button>
        <button id="sb-star" type="button" aria-label="加入自選">☆</button>
        <h2 id="sb-company-name" style="margin: 6px 40px 4px 0; font-size: 24px; font-weight: 700;">公司名稱</h2>
        <div id="sb-stock-id" style="color: var(--text-3); font-size: 14px; margin-bottom: 22px;">XXXX</div>

        <div class="card">
            <div class="card-title">市場報價</div>
            <div class="data-row"><span class="data-label">最新股價</span><span class="data-value" id="sb-price">--</span></div>
            <div class="ret-row" id="sb-returns">
                <div class="ret-cell"><span class="ret-label">今日</span><span class="ret-val" id="sb-ret-1">—</span></div>
                <div class="ret-cell"><span class="ret-label">5 日</span><span class="ret-val" id="sb-ret-5">—</span></div>
                <div class="ret-cell"><span class="ret-label">20 日</span><span class="ret-val" id="sb-ret-20">—</span></div>
            </div>
            <span id="sb-ex-badge"></span>
            <div class="chart-title">近 60 日收盤價</div>
            <div class="chart-box" id="sb-chart-price"></div>
        </div>

        <div class="card">
            <div class="card-title">營收動能</div>
            <div class="data-row"><span class="data-label">資料月份</span><span class="data-value" id="sb-month">--</span></div>
            <div class="data-row"><span class="data-label">營收年增率 (YoY)</span><span class="data-value" id="sb-yoy">--</span></div>
            <div class="data-row"><span class="data-label">營收月增率 (MoM)</span><span class="data-value" id="sb-mom">--</span></div>
            <div class="data-row"><span class="data-label">累計年增率</span><span class="data-value" id="sb-acc-yoy">--</span></div>
            <div class="chart-title">近 12 月營收年增率 (%)</div>
            <div class="chart-box" id="sb-chart-yoy"></div>
        </div>

        <div class="card">
            <div class="card-title">法人動向</div>
            <div class="data-row"><span class="data-label">最近交易日</span><span class="data-value" id="sb-trade-date">--</span></div>
            <div class="data-row"><span class="data-label">投信買賣超</span><span class="data-value" id="sb-trust">--</span></div>
            <div class="data-row"><span class="data-label">外資買賣超</span><span class="data-value" id="sb-foreign">--</span></div>
            <div class="chart-title">近 20 日投信買賣超 (張)</div>
            <div class="chart-box" id="sb-chart-flow"></div>
            <div class="chart-title">近 20 日外資買賣超 (張)</div>
            <div class="chart-box" id="sb-chart-flow-foreign"></div>
        </div>

        <div class="card">
            <div class="card-title">訊號</div>
            <div id="sb-signals"></div>
        </div>

        <div class="card">
            <div class="card-title">近一年除權息</div>
            <div id="sb-ex-list"></div>
        </div>
    </aside>

    <button id="trend-toggle" class="glass glass-pill refract" type="button" aria-expanded="false" aria-controls="trend-panel">走勢</button>
    <section id="trend-panel" class="glass refract" aria-label="產業走勢">
        <div class="trend-row" id="trend-ranges" role="group" aria-label="區間"><span class="lbl">區間</span>
            <button type="button" data-range="1M">1M</button><button type="button" data-range="3M" class="active">3M</button>
            <button type="button" data-range="6M">6M</button><button type="button" data-range="1Y">1Y</button>
        </div>
        <div class="trend-row" id="trend-modes" role="group" aria-label="模式"><span class="lbl">模式</span>
            <button type="button" data-mode="industry" class="active">產業 vs 大盤</button><button type="button" data-mode="tiers">上中下游</button>
        </div>
        <div style="color: var(--text-2); font-size: 12px; margin-bottom: 4px;">加入節點（最多 5 個）</div>
        <div id="trend-nodes"></div>
        <div id="trend-chart"></div>
        <div id="trend-msg" role="status"></div>
        <div class="trend-notes"><div id="trend-notes-fixed"></div><div id="trend-notes"></div></div>
    </section>

    <svg id="canvas"></svg>

    <script src="{{ url_for('static', filename='js/format.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/layout.js') }}"></script>
    <script src="{{ url_for('static', filename='js/trend.js') }}"></script>
    <script>
        const majorId = {{ major_id | tojson }};
        const majorName = {{ major_name | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/industry.js') }}"></script>
</body>
</html>
