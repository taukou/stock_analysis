<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股市產業鏈系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #0f1835 50%, #050a15 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 滾動容器，讓頁面可以滾動 */
        body::before {
            content: '';
            display: block;
            height: 200vh;
            pointer-events: none;
        }

        /* 背景圖容器 */
        .hero-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('/static/stock_background.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
            opacity: 0.85;
            transition: filter 0.3s ease;
        }

        .hero-section.dimmed {
            filter: brightness(0.4);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* 標題和說明 */
        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 3;
            width: 90%;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .hero-content p {
            font-size: 1.3rem;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
        }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: white;
            font-size: 0.9rem;
            opacity: 0.7;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* 主要內容容器 */
        .content-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 5;
            background: transparent;
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            max-height: 70vh;
            overflow-y: auto;
            transform: translateY(100%);
            pointer-events: none;
        }

        .content-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .content-section {
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            color: #00d4ff;
            font-size: 2.5rem;
            margin-bottom: 50px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        /* 卡片網格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 140px));
            gap: 20px;
            margin-bottom: 50px;
            justify-content: center;
        }

        .industry-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 15px 10px;
            cursor: pointer;
            transition: none;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            border-left: 5px solid #00d4ff;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            transform: translateY(0);
        }

        .industry-card.animate-up {
            transform: translateY(0);
        }

        .industry-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 24px rgba(0, 212, 255, 0.4);
            border-left-color: #00ff88;
        }

        .industry-card h3 {
            color: #16213e;
            font-size: 1rem;
            margin-bottom: 8px;
            font-weight: 600;
            line-height: 1.2;
        }

        .industry-card p {
            color: #666;
            font-size: 0.75rem;
            margin-bottom: 10px;
            flex-grow: 1;
            min-height: 25px;
            line-height: 1.2;
            display: block;
        }

        .industry-card a {
            display: inline-block;
            background: #00d4ff;
            color: #0f3460;
            padding: 5px 10px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            align-self: flex-start;
        }

        .industry-card a:hover {
            background: #00ff88;
        }

        .industry-card a:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2rem;
            }

            .hero-content p {
                font-size: 1rem;
            }

            .cards-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 180px));
                gap: 20px;
            }

            .section-title {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }

            .content-wrapper {
                padding: 40px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景區域 -->
    <div class="hero-section"></div>
    <div class="hero-overlay"></div>

    <!-- 標題和說明 -->
    <div class="hero-content">
        <h1>股市產業鏈分析系統</h1>
        <p>探索上市公司產業鏈結構，分析市場動態</p>
    </div>

    <div class="scroll-hint">↓ 向下滑動查看產業 ↓</div>

    <!-- 產業卡片區域 -->
    <div class="content-wrapper">
        <div class="content-section">
            <div class="section-title">選擇您感興趣的產業</div>
            <div class="cards-grid">
                {% for ind in industries %}
                <div class="industry-card">
                    <h3>{{ ind.major_name }}</h3>
                    <p>探索 {{ ind.major_name }} 產業的完整供應鏈</p>
                    <a href="/industry/{{ ind.major_id }}">進入分析 →</a>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <div style="background: #000; color: #00d4ff; padding: 30px 20px; text-align: center; font-size: 0.9rem; border-top: 2px solid #00d4ff; box-shadow: 0 -5px 20px rgba(0, 212, 255, 0.1);">
        <p>股市產業鏈分析系統 © 2026 | 提供最新的上市公司產業鏈數據</p>
    </div>

    <script>
        let lastScrollY = 0;
        let scrollTimeout;
        let isAutoScrolling = false;
        const heroHeight = window.innerHeight;
        const heroSection = document.querySelector('.hero-section');
        const contentWrapper = document.querySelector('.content-wrapper');

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            const isScrollingDown = currentScrollY > lastScrollY;
            const isScrollingUp = currentScrollY < lastScrollY;

            // 當滾動超過 hero 區域高度時，背景黯淡並顯示圖卡
            if (currentScrollY > heroHeight * 0.2) {
                heroSection.classList.add('dimmed');
                contentWrapper.classList.add('visible');
            } else {
                heroSection.classList.remove('dimmed');
                contentWrapper.classList.remove('visible');
            }

            // 自動定位邏輯
            if (!isAutoScrolling) {
                if (isScrollingDown && currentScrollY <= heroHeight) {
                    isAutoScrolling = true;
                    clearTimeout(scrollTimeout);
                    
                    window.scrollTo({
                        top: heroHeight,
                        behavior: 'smooth'
                    });
                    
                    scrollTimeout = setTimeout(() => {
                        isAutoScrolling = false;
                    }, 600);
                }
                else if (isScrollingUp && currentScrollY <= heroHeight + 50) {
                    isAutoScrolling = true;
                    clearTimeout(scrollTimeout);
                    
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                    
                    scrollTimeout = setTimeout(() => {
                        isAutoScrolling = false;
                    }, 600);
                }
            }

            lastScrollY = currentScrollY;
        });

        // 點擊產業卡片時清除自動滾動
        document.querySelectorAll('.industry-card a').forEach(link => {
            link.addEventListener('click', (e) => {
                isAutoScrolling = false;
                clearTimeout(scrollTimeout);
            });
        });
    </script>
</body>
</html>
