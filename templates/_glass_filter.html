<!-- Liquid Glass 折射濾鏡：只有 Chromium（Chrome / Edge）支援在 backdrop-filter 參照 SVG 濾鏡，
     其他瀏覽器不加 supports-refraction，退回純模糊。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="liquid-refract" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
        <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
</svg>
<script>
    (function () {
        var isChromium = !!(navigator.userAgentData && navigator.userAgentData.brands &&
            navigator.userAgentData.brands.some(function (b) { return /Chromium/.test(b.brand); }));
        if (isChromium) document.documentElement.classList.add("supports-refraction");
    })();
</script>
